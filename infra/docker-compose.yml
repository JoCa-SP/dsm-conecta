services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_DB: dsm_conecta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
  
  ingestao:
    build: ../backend/ingestao
    environment:
      MQTT_HOST: mosquitto
      DB_HOST: timescaledb
    depends_on:
      - mosquitto
      - timescaledb
    volumes:
      - ../backend/ingestao:/app
      
volumes:
  timescale_data: